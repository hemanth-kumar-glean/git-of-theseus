name: Build and run

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build binaries
        run: cargo build --manifest-path rust/Cargo.toml --bins --locked

      - name: Run tests
        run: |
          git clone https://github.com/erikbern/git-of-theseus
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-analyze -- git-of-theseus --outdir got
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-stack-plot -- got/cohorts.json
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-stack-plot -- got/cohorts.json --normalize
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-stack-plot -- got/exts.json
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-stack-plot -- got/authors.json
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-line-plot -- got/authors.json
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-line-plot -- got/dirs.json
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-survival-plot -- got/survival.json --exp-fit
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-analyze -- --help
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-stack-plot -- --help
          cargo run --manifest-path rust/Cargo.toml --bin git-of-theseus-survival-plot -- --help
